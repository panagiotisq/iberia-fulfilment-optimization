[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fulfillopt"
version = "1.0.0"
description = "Forecast-to-fulfilment: probabilistic forecasting, stochastic capacity planning and online order assignment for an e-commerce fulfilment network"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "highspy==1.15.1", "lightgbm>=4.0",
                "scikit-learn>=1.3", "matplotlib>=3.8", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fulfillopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
